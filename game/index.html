<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Looty Game</title>
  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
      background:#0b1020;
      color:#fff;
      overflow-x:hidden;
      overflow-y:auto;
      scrollbar-width:none;
    }

    html,
    body{
      width:100%;
      min-height:100%;
    }

    body::-webkit-scrollbar{
      display:none;
    }

    .loader{
      position:fixed;
      inset:0;
      z-index:2;
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(circle at 50% 42%, rgba(235,255,61,.14) 0%, rgba(235,255,61,0) 28%),
        linear-gradient(180deg, rgba(12,16,27,.98) 0%, rgba(7,10,18,.96) 100%);
      pointer-events:none;
      opacity:1;
      transition:opacity .28s ease, visibility .28s ease;
      touch-action:pan-y;
    }

    .loader.is-hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:auto;
    }

    .loader-card{
      display:grid;
      justify-items:center;
      gap:12px;
      color:#f7f8fc;
      text-align:center;
    }

    .loader-brand{
      color:#ebff3d;
      font-size:30px;
      font-weight:900;
      letter-spacing:.03em;
      line-height:1;
      text-shadow:0 0 18px rgba(235,255,61,.18);
    }

    .loader-copy{
      margin:0;
      color:rgba(247,248,252,.74);
      font-size:14px;
      font-weight:700;
      letter-spacing:.04em;
    }

    .loader-ring{
      width:34px;
      height:34px;
      border:3px solid rgba(235,255,61,.18);
      border-top-color:#ebff3d;
      border-radius:999px;
      animation:loaderSpin .82s linear infinite;
    }

    @keyframes loaderSpin{
      to{
        transform:rotate(360deg);
      }
    }

    .error{
      padding:16px;
      font-size:16px;
      color:#fff;
    }

    #game{
      position:sticky;
      top:0;
      width:100%;
      height:100vh;
      height:100dvh;
      overflow:hidden;
    }

    .scroll-handoff{
      height:128px;
      pointer-events:none;
    }

    iframe{
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:#fff;
    }
  </style>
</head>

<body>
  <div id="loading" class="loader" role="status" aria-live="polite">
    <div class="loader-card">
      <div class="loader-brand">Looty</div>
      <div class="loader-ring" aria-hidden="true"></div>
      <p class="loader-copy">Entering game...</p>
    </div>
  </div>
  <div id="game"></div>
  <div class="scroll-handoff" aria-hidden="true"></div>

  <script type="module">
    import { supabase } from "/src/lib/supabaseClient.js"
    import { ERROR_CODES, showErrorModal } from "/src/ui/error-modal.js"

    const params = new URLSearchParams(location.search)
    const slug = params.get("slug")

    function primeParentScroll(){
      if (window.scrollY > 0) return
      if (document.documentElement.scrollHeight <= window.innerHeight) return

      window.requestAnimationFrame(() => {
        window.scrollTo(0, 1)
      })
    }

    function showError({ code, title, message, error }){
      document.body.replaceChildren()

      const errorBox = document.createElement("div")
      errorBox.className = "error"

      const heading = document.createElement("strong")
      heading.textContent = title

      const copy = document.createElement("div")
      copy.textContent = message

      const codeText = document.createElement("div")
      codeText.style.marginTop = "8px"
      codeText.style.opacity = ".72"
      codeText.textContent = `錯誤代碼：${code}`

      errorBox.append(heading, copy, codeText)
      document.body.append(errorBox)

      showErrorModal({
        code,
        title,
        message,
        error,
      })
    }

    async function main() {
      if (!slug) {
        showError({
          code: ERROR_CODES.GAME_MISSING_SLUG,
          title: "缺少遊戲代碼",
          message: "目前無法判斷要載入哪一款遊戲，請從遊戲列表重新進入。",
        })
        return
      }

      const { data, error } = await supabase
        .from("public_games_v1")
        .select("id, slug, name, launch_url")
        .eq("slug", slug)
        .maybeSingle()

      if (error) {
        showError({
          code: ERROR_CODES.GAME_READ_FAILED,
          title: "遊戲資料讀取失敗",
          message: "目前無法取得遊戲資料，請稍後再試。",
          error,
        })
        return
      }

      if (!data) {
        showError({
          code: ERROR_CODES.GAME_NOT_FOUND,
          title: "找不到遊戲",
          message: "找不到指定的公開遊戲，請回到遊戲列表重新選擇。",
        })
        return
      }

      const gameUrl = data.launch_url?.trim()

      if (!gameUrl) {
        showError({
          code: ERROR_CODES.GAME_URL_MISSING,
          title: "遊戲啟動網址未設定",
          message: "這款遊戲目前缺少啟動網址，請聯絡管理員。",
        })
        return
      }

      const iframe = document.createElement("iframe")
      iframe.src = gameUrl
      iframe.title = data.name || "Looty Game"

      iframe.onload = () => {
        const loadingEl = document.getElementById("loading")
        if (!loadingEl) return

        loadingEl.classList.add("is-hidden")
        window.setTimeout(() => {
          loadingEl.remove()
        }, 320)
      }

      document.getElementById("game").appendChild(iframe)
      primeParentScroll()
    }

    main().catch((error) => {
      showError({
        code: ERROR_CODES.GAME_READ_FAILED,
        title: "遊戲載入失敗",
        message: "目前無法載入遊戲，請稍後再試。",
        error,
      })
    })
  </script>
</body>
</html>
