<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#181e22">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/looty-app-icon-192.png">
  <link rel="apple-touch-icon" href="/icons/looty-app-icon-180.png">
  <title>Looty Game</title>
  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
      background:#0b1020;
      color:#fff;
      overflow-x:hidden;
      overflow-y:auto;
      scrollbar-width:none;
    }

    html,
    body{
      width:100%;
      min-height:100%;
    }

    body::-webkit-scrollbar{
      display:none;
    }

    .loader{
      position:fixed;
      inset:0;
      z-index:2;
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(circle at 50% 42%, rgba(235,255,61,.14) 0%, rgba(235,255,61,0) 28%),
        linear-gradient(180deg, rgba(12,16,27,.98) 0%, rgba(7,10,18,.96) 100%);
      pointer-events:auto;
      opacity:1;
      transition:opacity .28s ease, visibility .28s ease;
      touch-action:pan-y;
    }

    .loader.is-hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .loader-card{
      display:grid;
      justify-items:center;
      gap:12px;
      color:#f7f8fc;
      text-align:center;
    }

    .loader-brand{
      color:#ebff3d;
      font-size:30px;
      font-weight:900;
      letter-spacing:.03em;
      line-height:1;
      text-shadow:0 0 18px rgba(235,255,61,.18);
    }

    .loader-copy{
      margin:0;
      color:rgba(247,248,252,.74);
      font-size:14px;
      font-weight:700;
      letter-spacing:.04em;
    }

    .loader-ring{
      width:34px;
      height:34px;
      border:3px solid rgba(235,255,61,.18);
      border-top-color:#ebff3d;
      border-radius:999px;
      animation:loaderSpin .82s linear infinite;
    }

    @keyframes loaderSpin{
      to{
        transform:rotate(360deg);
      }
    }

    .error{
      padding:16px;
      font-size:16px;
      color:#fff;
    }

    #game{
      position:sticky;
      top:0;
      width:100%;
      height:100vh;
      height:100dvh;
      overflow:hidden;
    }

    .scroll-handoff{
      height:128px;
      pointer-events:none;
    }

    iframe{
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:#fff;
    }
  </style>
</head>

<body>
  <div id="loading" class="loader" role="status" aria-live="polite">
    <div class="loader-card">
      <div class="loader-brand">Looty</div>
      <div class="loader-ring" aria-hidden="true"></div>
      <p class="loader-copy">Entering game...</p>
    </div>
  </div>
  <div id="game"></div>
  <div class="scroll-handoff" aria-hidden="true"></div>

  <script type="module" src="/src/pages/game/index.js"></script>
</body>
</html>
